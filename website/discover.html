<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dawsons — discover genres</title>
  <meta name="description" content="Pay attention to the layers in your favorite artists' songs, then open a similarly-built original example right in the Dawsons DAW." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/daw.css" />
  <style>
    .discover-main {
      max-width: 980px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .genre-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0 1.5rem;
    }
    .genre-tabs button {
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel-alt);
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .genre-tabs button.is-active {
      background: var(--purple-deep);
      border-color: var(--purple-deep);
      color: #fff;
    }
    .inspiration-list {
      list-style: none;
      padding: 0;
      margin: 0 0 2rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
    }
    .inspiration-list li {
      padding: 0.3rem 0;
      font-size: 0.9rem;
      color: var(--text-dim);
    }
    .spotlight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    .spotlight-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .spotlight-embed {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.6rem;
      background: #000;
    }
    .spotlight-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .spotlight-card h3 {
      margin: 0 0 0.3rem;
      font-size: 1rem;
    }
    .spotlight-card p {
      margin: 0 0 0.7rem;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .spotlight-card button {
      width: 100%;
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--purple-deep);
      background: var(--purple-deep);
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="daw-shell">
    <header class="daw-nav">
      <div class="daw-logo" title="A440 — the international concert-pitch standard adopted in 1939, the reference tone every orchestra and instrument still tunes to.">
        <svg class="daw-logo__mark" viewBox="0 0 52 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="noteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--purple)" />
              <stop offset="55%" stop-color="var(--rose)" />
              <stop offset="100%" stop-color="var(--ochre)" />
            </linearGradient>
          </defs>
          <path d="M 38 8 A 15 15 0 0 1 38 34" stroke="var(--teal)" stroke-width="1.3" fill="none" opacity="0.5" stroke-linecap="round" />
          <path d="M 43 3 A 22 22 0 0 1 43 39" stroke="var(--teal)" stroke-width="1.1" fill="none" opacity="0.3" stroke-linecap="round" />
          <ellipse cx="15" cy="47" rx="9.5" ry="6.8" transform="rotate(-16 15 47)" fill="url(#noteGradient)" />
          <rect x="22.2" y="9" width="2.8" height="39" rx="1.4" fill="url(#noteGradient)" />
          <path d="M 24.6 9 C 32 6.5 41 10.5 39.5 19 C 38.3 25.5 30.5 27.5 26 25 C 30.5 20.5 31.5 14 24.6 9 Z" fill="url(#noteGradient)" />
        </svg>
        <span class="daw-logo__text">
          <span class="daw-logo__my">My</span>
          <span class="daw-logo__dawsons">Dawsons</span>
        </span>
      </div>
      <nav class="daw-nav__links">
        <a href="index.html">Open the DAW</a>
      </nav>
    </header>

    <main class="discover-main">
      <h1 style="margin-bottom: 0.3rem">Pay attention to the layers</h1>
      <p class="daw-note" style="font-size: 0.95rem">
        Your favorite artists build songs the same way you're about to — vocal, guitar, bass, keys,
        drums, each on its own layer. Let's look at a few, then open a similarly-built original
        example right in the Dawsons DAW to see how it comes apart.
      </p>

      <div class="genre-tabs" id="genre-tabs"></div>
      <ul class="inspiration-list" id="inspiration-list"></ul>
      <div class="spotlight-grid" id="spotlight-grid"></div>
    </main>
  </div>

  <script type="module" src="js/discover.js"></script>
</body>
</html>
