      <stop offset="0%" stop-color="#b48ee0" />
      <stop offset="55%" stop-color="#c98aa0" />
      <stop offset="100%" stop-color="#d1a85c" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="52" height="60" rx="12" fill="#15121e" />
  <path d="M 38 8 A 15 15 0 0 1 38 34" stroke="#5fa8a0" stroke-width="1.3" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 43 3 A 22 22 0 0 1 43 39" stroke="#5fa8a0" stroke-width="1.1" fill="none" opacity="0.3" stroke-linecap="round" />
