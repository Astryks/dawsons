[project]
name = "dawsons-ai-sidecar"
version = "0.1.0"
description = "Local AI analysis service for Dawsons, spawned and supervised by the desktop app"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "demucs>=4.0.1",
    "torch>=2.4",
    "torchaudio>=2.4",
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "jsonschema>=4.20",
    "ace-step>=0.2",
]

# librosa/soundfile land with M5 (tempo/key/chord detection) — not needed
# for M4's stem-separation-only scope.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `models/` holds weight manifests + a standalone script (run directly,
# not imported), not a Python package — exclude it from discovery.
include = ["app*"]
